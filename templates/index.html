<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Monitor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 20px; }
        h1 { text-align: center; color: #1d3557; }
        .gpu-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .gpu-card { background-color: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 20px; width: 340px; }
        .gpu-card h2 { margin-top: 0; color: #457b9d; }
        .info-item { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .info-item span:first-child { font-weight: bold; }
        .progress-bar-container { background-color: #e9ecef; border-radius: .25rem; height: 20px; width: 100%; }
        .progress-bar { background-color: #2a9d8f; height: 100%; text-align: center; color: white; line-height: 20px; border-radius: .25rem; transition: width 0.5s ease-in-out; }
        .temp-bar { background: linear-gradient(to right, #66ff66, #ffff66, #ff6666); height: 100%; text-align: center; color: black; font-weight: bold; line-height: 20px; border-radius: .25rem; transition: width 0.5s ease-in-out; }
        .process-section { margin-top: 12px; border-top: 1px solid #e9ecef; padding-top: 10px; }
        .process-section h3 { margin: 0 0 8px; font-size: 0.9rem; color: #457b9d; }
        .process-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        .process-table th { text-align: left; color: #888; font-weight: normal; padding: 2px 4px; border-bottom: 1px solid #e9ecef; }
        .process-table td { padding: 3px 4px; vertical-align: top; border-bottom: 1px solid #f5f5f5; }
        .process-table td.mem { text-align: right; white-space: nowrap; }
        .process-cmd { font-family: monospace; word-break: break-all; }
        .user-badge { display: inline-block; padding: 1px 7px; border-radius: 10px; color: #fff; font-weight: bold; white-space: nowrap; }
        .idle { color: #aaa; text-align: center; font-style: italic; margin: 6px 0 0; }
    </style>
</head>
<body>
    <h1>GPU Real-time Monitor</h1>
    <div id="gpu-container" class="gpu-container">
        <!-- GPU data will be loaded here -->
    </div>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // hash ชื่อ user → สี badge คงที่ ให้กวาดตาแยกเจ้าของได้เร็ว
        function userColor(name) {
            let hash = 0;
            for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
            return `hsl(${hash % 360}, 55%, 45%)`;
        }

        function renderProcesses(processes) {
            if (!processes || processes.length === 0) {
                return '<p class="idle">— idle —</p>';
            }
            const rows = processes.map(p => `
                <tr>
                    <td><span class="user-badge" style="background:${userColor(p.user)}">${escapeHtml(p.user)}</span></td>
                    <td class="process-cmd" title="PID ${p.pid}">${escapeHtml(p.command)}</td>
                    <td class="mem">${p.memory_mb} MB</td>
                </tr>`).join('');
            return `
                <table class="process-table">
                    <thead><tr><th>User</th><th>Process</th><th>VRAM</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        function updateGpuInfo() {
            fetch('/api/gpu')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('gpu-container');
                    container.innerHTML = ''; // Clear previous data
                    if (data.length === 0 || data[0].error) {
                        container.innerHTML = '<p>Could not retrieve GPU data. Is a supported GPU driver installed?</p>';
                        return;
                    }
                    data.forEach(gpu => {
                        const card = document.createElement('div');
                        card.className = 'gpu-card';
                        card.innerHTML = `
                            <h2>GPU ${gpu.id} · ${gpu.name}</h2>
                            <div class="info-item">
                                <span>Temperature:</span>
                                <span>${gpu.temperature}°C</span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="temp-bar" style="width: ${gpu.temperature_raw}%">${gpu.temperature}°C</div>
                            </div>
                            <br>
                            <div class="info-item">
                                <span>GPU Load:</span>
                                <span>${gpu.load_percent}%</span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar" style="width: ${gpu.load_raw}%">${gpu.load_percent}%</div>
                            </div>
                            <br>
                            <div class="info-item">
                                <span>Memory Usage:</span>
                                <span>${gpu.memory_util_percent}%</span>
                            </div>
                             <div class="progress-bar-container">
                                <div class="progress-bar" style="width: ${gpu.memory_util_raw}%">${gpu.memory_util_percent}%</div>
                            </div>
                            <div class="info-item">
                                <span></span>
                                <span>${gpu.memory_used}MB / ${gpu.memory_total}MB</span>
                            </div>
                            <div class="process-section">
                                <h3>Processes</h3>
                                ${renderProcesses(gpu.processes)}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Error fetching GPU data:', error);
                    const container = document.getElementById('gpu-container');
                    container.innerHTML = '<p>Error fetching data. Check the console for details.</p>';
                });
        }

        // Update on page load and then every 2 seconds
        document.addEventListener('DOMContentLoaded', () => {
            updateGpuInfo();
            setInterval(updateGpuInfo, 2000);
        });
    </script>
</body>
</html>
